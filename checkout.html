<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commande — Shoply</title>
    <meta name="description" content="Finalisez votre commande Shoply." />
  </head>
  <body class="bg-white text-gray-900 dark:bg-gray-900 dark:text-gray-100">

    <header class="sticky top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-gray-200 dark:border-gray-800">
      <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
        <a href="index.html" class="text-2xl font-bold text-blue-600">Shoply</a>
        <ul class="hidden md:flex items-center gap-x-10 text-base font-medium">
          <li><a href="index.html" class="hover:text-blue-600">Accueil</a></li>
          <li><a href="products.html" class="hover:text-blue-600">Boutique</a></li>
          <li><a href="favorites.html" class="hover:text-blue-600">Favoris</a></li>
          <li><a href="cart.html" class="hover:text-blue-600">Panier</a></li>
        </ul>
        <div class="flex items-center gap-5">
          <button id="theme-toggle" aria-label="Basculer le thème">
            <i data-lucide="moon" class="w-5 h-5 dark:hidden" id="moon-icon"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block" id="sun-icon"></i>
          </button>
          <a href="favorites.html" aria-label="Favoris">
            <i data-lucide="heart" class="w-5 h-5"></i>
          </a>
          <a href="cart.html" aria-label="Panier" class="relative">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
          </a>
          <button id="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" class="md:hidden">
            <i data-lucide="menu" class="w-6 h-6" id="menu-icon"></i>
            <i data-lucide="x" class="w-6 h-6 hidden" id="close-icon"></i>
          </button>
        </div>
      </nav>
      <ul id="mobile-menu" class="hidden md:hidden flex-col gap-2 px-6 pb-4 text-base font-medium">
        <li><a href="index.html" class="block py-2">Accueil</a></li>
        <li><a href="products.html" class="block py-2">Boutique</a></li>
        <li><a href="favorites.html" class="block py-2">Favoris</a></li>
        <li><a href="cart.html" class="block py-2">Panier</a></li>
      </ul>
    </header>

    <main>
      <section class="max-w-7xl mx-auto px-6 py-12">
        <h1 class="text-3xl font-bold mb-2">Finaliser la commande</h1>
        <!-- Formulaire client + résumé de commande viendront ici -->
      </section>
    </main>

    <footer class="border-t border-gray-200 dark:border-gray-800 mt-12">
      <div class="max-w-7xl mx-auto px-6 py-14 grid grid-cols-2 md:grid-cols-3 gap-10">
        <div>
          <p class="font-bold text-xl mb-3">Shoply</p>
          <p class="text-base text-gray-500">Votre boutique en ligne de confiance.</p>
        </div>
        <div>
          <p class="font-semibold text-lg mb-3">Liens utiles</p>
          <ul class="text-base text-gray-500 space-y-2">
            <li><a href="#" class="hover:text-blue-600">À propos</a></li>
            <li><a href="#" class="hover:text-blue-600">Contact</a></li>
            <li><a href="#" class="hover:text-blue-600">FAQ</a></li>
          </ul>
        </div>
        <div>
          <p class="font-semibold text-lg mb-3">Légal</p>
          <ul class="text-base text-gray-500 space-y-2">
            <li><a href="#" class="hover:text-blue-600">Mentions légales</a></li>
            <li><a href="#" class="hover:text-blue-600">Politique de confidentialité</a></li>
          </ul>
        </div>
      </div>
      <p class="text-center text-sm text-gray-400 pb-8">© 2026 Shoply</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
